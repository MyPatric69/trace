owner: Patric
scope:
  authorized:
  - action: 'implement features in engine/, dashboard/, hooks/, server/, tests/. Read
      and write trace_config.yaml, ~/.trace/user_config.yaml, ~/.claude/settings.json,
      ~/.claude/statusline_bridge.sh. Run pytest tests/ -v. Execute git add/commit/push/pull.
      Manage LaunchAgents via launchctl. One external API call permitted: api.anthropic.com/v1/messages/count_tokens.
      No direct access to ~/.trace/trace.db.'
    reason: Core TRACE development scope
    added: '2026-09-05'
  prohibited:
  - action: delete or modify ~/.trace/trace.db directly
    reason: Central DB must never be touched directly — use TraceStore only
    severity: HARD_LIMIT
    added: '2026-09-05'
  - action: push to main without explicit user approval
    reason: Main branch changes require human sign-off
    severity: HARD_LIMIT
    added: '2026-09-05'
  - action: git reset --hard
    reason: History rewriting is irreversible
    severity: HARD_LIMIT
    added: '2026-09-05'
  - action: call external APIs other than api.anthropic.com/v1/messages/count_tokens
    reason: Only one external API is permitted per governance
    severity: HARD_LIMIT
    added: '2026-09-05'
  - action: modify files outside the project directory or ~/.trace/ or ~/.claude/
    reason: Agent must stay within authorized scope
    severity: HARD_LIMIT
    added: '2026-09-05'
  - action: commit in a loop or auto-sync more than once per session
    reason: Maximum one chore(context) auto-sync commit per session end
    severity: HARD_LIMIT
    added: '2026-09-05'
  - action: pip install system packages without explicit user confirmation
    reason: System package installation requires owner approval
    severity: HARD_LIMIT
    added: '2026-09-05'
  requires_confirmation:
  - action: git push origin main
    reason: Pushing to main affects shared history
  - action: git reset --hard
    reason: Destructive operation – cannot be undone
  - action: launchctl unload
    reason: Stops running services
  - action: rm -rf
    reason: Irreversible deletion
  - action: pip install
    reason: System package installation
harness:
  attempt_counter:
    max_attempts: 3
    reset_on: new_task
    action_on_exceed: escalate
  action_log:
    enabled: true
    path: ~/.trace/agentguard_actions.log
    format: timestamp | action | result
escalation:
  contact: MyPatric69
  method: log
  trigger: 2+ critical failures or loop detected
killswitch: AgentGuard stops it automatically
path_policy:
  denied_paths:
  - pattern: .env*
    reason: Secrets must never be written by the agent
  - pattern: .git/**
    reason: Git internals must not be modified directly
  protected_paths: []
  authorized_paths:
  - pattern: .claude/**
    reason: Auto-detected project directory
  - pattern: .pytest_cache/**
    reason: Auto-detected project directory
  - pattern: .ruff_cache/**
    reason: Auto-detected project directory
  - pattern: .vscode/**
    reason: Auto-detected project directory
  - pattern: dashboard/**
    reason: Auto-detected project directory
  - pattern: docs/**
    reason: Auto-detected project directory
  - pattern: engine/**
    reason: Auto-detected project directory
  - pattern: hooks/**
    reason: Auto-detected project directory
  - pattern: server/**
    reason: Auto-detected project directory
  - pattern: tests/**
    reason: Auto-detected project directory
  - pattern: '*.md'
    reason: Documentation
  - pattern: governance.yaml
    reason: AgentGuard governance file
  - pattern: trace.sh
    reason: Lifecycle manager
  - pattern: trace_config.yaml
    reason: Model pricing config
  default_for_unmatched: ask
cost_awareness:
  thresholds:
  - at_usd: 5.0
    level: warn
  repeat_last_threshold: true
  repeat_interval_usd: 10.0
governance_history:
- date: '2026-09-05'
  action: Initial governance created
  tool: agentguard init --guided
  version: 1.0.8
- date: '2026-09-05'
  action: Added requires_confirmation, harness with attempt_counter and action_log
  tool: manual
  version: 1.0.8
